name: Build APK Guru

on:
  workflow_dispatch:
    inputs:
      ai_api_url:
        description: "Alamat Cloudflare Worker (contoh https://school-lms-ai.akun.workers.dev)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK debug (khusus guru)
        run: gradle assembleDebug --no-daemon -PteacherAi=true "-PaiApiUrl=${{ github.event.inputs.ai_api_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: SchoolLMS-guru-apk
          path: app/build/outputs/apk/debug/app-debug.apk
